name: Deploy to Vercel

on:
  workflow_dispatch:
    inputs:
      production:
        description: 'Deploy to production'
        type: boolean
        default: true
  push:
    branches:
      - main
      - 'claude/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::VERCEL_TOKEN secret is not set."
            exit 1
          fi
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Link Vercel project
        run: vercel link --yes --project mapregs --scope team_wh6uVRNQGEkQxohZXAbEYJvW --token "${{ secrets.VERCEL_TOKEN }}"

      - name: Disable deployment protection (make site publicly accessible)
        run: |
          PROJECT_ID=$(cat .vercel/project.json | python3 -c "import json,sys; print(json.load(sys.stdin)['projectId'])")
          echo "Project ID: $PROJECT_ID"
          curl -sf -X PATCH \
            "https://api.vercel.com/v9/projects/$PROJECT_ID?teamId=team_wh6uVRNQGEkQxohZXAbEYJvW" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"ssoProtection": null, "passwordProtection": null}' | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          p=d.get('ssoProtection')
          pp=d.get('passwordProtection')
          print('ssoProtection:', p, '| passwordProtection:', pp)
          print('Deployment protection disabled.' if p is None and pp is None else 'WARNING: protection still active')
          "

      - name: Sync ANTHROPIC_API_KEY to Vercel
        run: |
          for target in production preview; do
            vercel env rm ANTHROPIC_API_KEY "$target" --yes --token "${{ secrets.VERCEL_TOKEN }}" 2>/dev/null || true
            printf '%s' "${{ secrets.ANTHROPIC_API_KEY }}" | vercel env add ANTHROPIC_API_KEY "$target" --token "${{ secrets.VERCEL_TOKEN }}"
          done

      - name: Provision Blob analytics store
        run: |
          TEAM=team_wh6uVRNQGEkQxohZXAbEYJvW
          TOKEN="${{ secrets.VERCEL_TOKEN }}"
          PROJECT_ID=$(jq -r .projectId .vercel/project.json)

          ENVS=$(vercel env ls production --token "$TOKEN" 2>/dev/null || true)
          if echo "$ENVS" | grep -q "BLOB_READ_WRITE_TOKEN"; then
            echo "Blob store already connected."
            exit 0
          fi

          echo "Creating Blob store..."
          vercel blob create-store mapregs-analytics --access private --token "$TOKEN" 2>&1 | head -5 || true

          # Find the store ID via the REST API (IDs are not secret; tokens are never printed)
          CODE=$(curl -s -o /tmp/stores.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.vercel.com/v1/storage/stores?teamId=$TEAM")
          echo "List stores: HTTP $CODE"
          jq -r '.error.message? // empty' /tmp/stores.json
          STORE_ID=$(jq -r '.stores[]? | select(.name=="mapregs-analytics") | .id' /tmp/stores.json | head -1)
          echo "Store ID: ${STORE_ID:-<not found>}"
          if [ -z "$STORE_ID" ]; then
            echo "Response JSON keys (for debugging):"
            jq -r 'paths(scalars) as $p | $p | join(".")' /tmp/stores.json 2>/dev/null | sort -u | head -30
          fi

          # Connect the store to the project (injects BLOB_READ_WRITE_TOKEN env var)
          if [ -n "$STORE_ID" ]; then
            CODE=$(curl -s -o /tmp/conn.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
              -d "{\"projectId\":\"$PROJECT_ID\",\"envVarEnvironments\":[\"production\",\"preview\",\"development\"]}" \
              "https://api.vercel.com/v1/storage/stores/$STORE_ID/connections?teamId=$TEAM")
            echo "Connect store: HTTP $CODE"
            jq -r '.error.message? // empty' /tmp/conn.json
            if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
              echo "Response JSON keys (for debugging):"
              jq -r 'paths(scalars) as $p | $p | join(".")' /tmp/conn.json 2>/dev/null | sort -u | head -30
            fi
          fi

          ENVS=$(vercel env ls production --token "$TOKEN" 2>/dev/null || true)
          if echo "$ENVS" | grep -q "BLOB_READ_WRITE_TOKEN"; then
            echo "Blob store connected successfully."
          else
            echo "::warning::Could not auto-connect a Blob store. Create one in the Vercel dashboard: mapregs project -> Storage -> Create Database -> Blob."
          fi

      - name: Ensure ADMIN_KEY for /admin dashboard
        run: |
          if [ -n "${{ secrets.ADMIN_KEY }}" ]; then
            echo "Using ADMIN_KEY from GitHub secret."
            for target in production preview; do
              vercel env rm ADMIN_KEY "$target" --yes --token "${{ secrets.VERCEL_TOKEN }}" 2>/dev/null || true
              printf '%s' "${{ secrets.ADMIN_KEY }}" | vercel env add ADMIN_KEY "$target" --token "${{ secrets.VERCEL_TOKEN }}"
            done
            exit 0
          fi
          ENVS=$(vercel env ls production --token "${{ secrets.VERCEL_TOKEN }}" 2>/dev/null || true)
          if echo "$ENVS" | grep -q "ADMIN_KEY"; then
            echo "ADMIN_KEY already set on the project."
            exit 0
          fi
          KEY=$(openssl rand -hex 12)
          echo "::add-mask::$KEY"
          for target in production preview; do
            printf '%s' "$KEY" | vercel env add ADMIN_KEY "$target" --token "${{ secrets.VERCEL_TOKEN }}"
          done
          echo "Generated a new ADMIN_KEY. View it in the Vercel dashboard: mapregs project -> Settings -> Environment Variables -> ADMIN_KEY (click the eye icon to reveal)."

      - name: Deploy
        id: deploy
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/claude/determined-johnson-gzixk" ] || [ "${{ inputs.production }}" = "true" ]; then
            echo "Deploying to PRODUCTION"
            URL=$(vercel deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}")
          else
            echo "Deploying PREVIEW"
            URL=$(vercel deploy --yes --token "${{ secrets.VERCEL_TOKEN }}")
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "### Vercel deployment"
            echo ""
            echo "**Live URL:** https://$URL"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed: $URL"

      - name: Verify site is publicly reachable
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          URL=$(echo "$DEPLOY_URL" | sed 's|^https://||')
          if [ -z "$URL" ]; then
            echo "Could not read URL from output, skipping verification"
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://$URL")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Site is publicly reachable at https://$URL"
          else
            echo "::warning::Unexpected status $STATUS — protection may still be active"
          fi
