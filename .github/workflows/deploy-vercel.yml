name: Deploy to Vercel

on:
  workflow_dispatch:
    inputs:
      production:
        description: 'Deploy to production'
        type: boolean
        default: true
  push:
    branches:
      - main
      - 'claude/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::VERCEL_TOKEN secret is not set."
            exit 1
          fi
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Link Vercel project
        run: vercel link --yes --project mapregs --scope team_wh6uVRNQGEkQxohZXAbEYJvW --token "${{ secrets.VERCEL_TOKEN }}"

      - name: Disable deployment protection (make site publicly accessible)
        run: |
          PROJECT_ID=$(cat .vercel/project.json | python3 -c "import json,sys; print(json.load(sys.stdin)['projectId'])")
          echo "Project ID: $PROJECT_ID"
          curl -sf -X PATCH \
            "https://api.vercel.com/v9/projects/$PROJECT_ID?teamId=team_wh6uVRNQGEkQxohZXAbEYJvW" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"ssoProtection": null, "passwordProtection": null}' | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          p=d.get('ssoProtection')
          pp=d.get('passwordProtection')
          print('ssoProtection:', p, '| passwordProtection:', pp)
          print('Deployment protection disabled.' if p is None and pp is None else 'WARNING: protection still active')
          "

      - name: Sync ANTHROPIC_API_KEY to Vercel
        run: |
          for target in production preview; do
            vercel env rm ANTHROPIC_API_KEY "$target" --yes --token "${{ secrets.VERCEL_TOKEN }}" 2>/dev/null || true
            printf '%s' "${{ secrets.ANTHROPIC_API_KEY }}" | vercel env add ANTHROPIC_API_KEY "$target" --token "${{ secrets.VERCEL_TOKEN }}"
          done

      - name: Sync ADMIN_KEY to Vercel (optional, for /admin dashboard)
        run: |
          if [ -z "${{ secrets.ADMIN_KEY }}" ]; then
            echo "ADMIN_KEY secret not set — skipping (the /admin page will show setup instructions)"
            exit 0
          fi
          for target in production preview; do
            vercel env rm ADMIN_KEY "$target" --yes --token "${{ secrets.VERCEL_TOKEN }}" 2>/dev/null || true
            printf '%s' "${{ secrets.ADMIN_KEY }}" | vercel env add ADMIN_KEY "$target" --token "${{ secrets.VERCEL_TOKEN }}"
          done

      - name: Deploy
        id: deploy
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/claude/determined-johnson-gzixk" ] || [ "${{ inputs.production }}" = "true" ]; then
            echo "Deploying to PRODUCTION"
            URL=$(vercel deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}")
          else
            echo "Deploying PREVIEW"
            URL=$(vercel deploy --yes --token "${{ secrets.VERCEL_TOKEN }}")
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "### Vercel deployment"
            echo ""
            echo "**Live URL:** https://$URL"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed: $URL"

      - name: Verify site is publicly reachable
        run: |
          URL=$(cat "$GITHUB_OUTPUT" | grep '^url=' | cut -d= -f2 || true)
          if [ -z "$URL" ]; then
            echo "Could not read URL from output, skipping verification"
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://$URL")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Site is publicly reachable at https://$URL"
          else
            echo "::warning::Unexpected status $STATUS — protection may still be active"
          fi
